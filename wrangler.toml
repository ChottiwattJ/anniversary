name = "anniversary"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Only serve on your own domain (no *.workers.dev copy).
workers_dev = false
routes = [{ pattern = "anniversary.chottiwatt.in.th", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "KV"
id = "6139d4bc96fb45e4b7bba738d0caee8c"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "anniversary-media"
